<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#460056">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFTest">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<meta name="description" content="PFBeacon · Surgeon PF Tracker: claims, quotes and consultations.">
<meta property="og:title" content="PFBeacon · Surgeon PF Tracker">
<meta property="og:description" content="Every PF claimed. Every peso collected.">
<meta property="og:image" content="https://sebsc888.github.io/Claims/test1/img/og-share-1200x630.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>PFTest</title>
<style>
  html,body{margin:0;height:100%;background:#460056;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#fff;box-sizing:border-box}
  #app iframe{border:0;width:100%;height:100%;display:block;background:#fff}
  #wait,#off{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff;background:#460056;text-align:center;padding:24px;box-sizing:border-box}
  #off{display:none;cursor:pointer}
  .logo{width:96px;height:96px;border-radius:24px;display:block}
  .big{font-size:32px;font-weight:700;line-height:1.25}
  .small{font-size:21px;opacity:.92}
  a.alt{color:#fff;font-size:21px;text-decoration:underline;padding:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="wait"><img class="logo" src="icons/icon-192.png" alt=""><div class="big">Opening PFBeacon…</div></div>
<div id="off" role="button" tabindex="0">
  <img class="logo" src="icons/icon-192.png" alt="">
  <div class="big">No internet.<br>Tap to try again</div>
  <div class="small" id="offmsg">Check Wi-Fi or mobile data.</div>
  <a class="alt" id="alt" href="#" target="_blank" rel="noopener">Open in Safari/Chrome instead</a>
</div>
<script src="config.js"></script>
<script>
(function () {
  var C = window.SCL_CONFIG || {}, EXEC = String(C.EXEC_URL || '');
  var APP_URL = EXEC + (EXEC.indexOf('?') < 0 ? '?' : '&') + 'app=1';   // never put the sign-in in the address
  // Each phone app keeps its own saved sign-in (APP_ID in config.js), so two apps on one phone never wipe each other's.
  // The development app at the top of the Claims site has no APP_ID and keeps the old names (its phones stay signed in).
  var AID = /^[a-z0-9-]{1,20}$/.test(String(C.APP_ID || '')) ? ':' + C.APP_ID : '';
  var KEY = 'scl_token' + AID, UKEY = 'scl_user' + AID;
  var app = document.getElementById('app'), wait = document.getElementById('wait'), off = document.getElementById('off');
  document.getElementById('alt').href = APP_URL;
  var timer = null, loaded = false;

  /* The ledger (inside the frame, on *.googleusercontent.com) asks us to keep its sign-in. Nobody else may. */
  var pinned = '';   // the ledger's origin, learned from the first accepted message
  function fromOurFrame(e) {
    var f = app.querySelector('iframe'), w = f && f.contentWindow;
    if (!w || !e.source) return false;
    // Apps Script nests its page one frame deeper, so the sender may be our frame or a child of it
    try { return e.source === w || e.source.parent === w; } catch (x) { return false; }
  }
  function onMessage(e) {
    var o = String(e.origin || '');
    if (!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/i.test(o)) return;
    if (!fromOurFrame(e)) return;            // another page (even another Apps Script app) cannot talk to us
    if (pinned && o !== pinned) return;
    pinned = pinned || o;
    var d = e.data; if (!d || d.scl !== 1) return;
    loaded = true; showApp();
    try {
      if (d.type === 'getToken') {
        var u = null; try { u = JSON.parse(localStorage.getItem(UKEY) || 'null'); } catch (x) {}
        e.source && e.source.postMessage({ scl: 1, type: 'token', token: localStorage.getItem(KEY) || '', user: u }, e.origin);
      } else if (d.type === 'setToken' && typeof d.token === 'string' && /^[a-f0-9]{64}$/.test(d.token)) {
        localStorage.setItem(KEY, d.token);
        if (d.user && typeof d.user === 'object') localStorage.setItem(UKEY, JSON.stringify(d.user));
      } else if (d.type === 'clearToken') {
        localStorage.removeItem(KEY); localStorage.removeItem(UKEY);
      }
    } catch (x) { /* storage blocked: the ledger keeps its own copy */ }
  }
  window.addEventListener('message', onMessage);
  window.SCL_onMessage = onMessage;   // for the automated test

  function showApp() { clearTimeout(timer); wait.style.display = 'none'; off.style.display = 'none'; }
  function showOffline() {
    clearTimeout(timer); wait.style.display = 'none'; off.style.display = 'flex';
    var online = navigator.onLine !== false;   // the browser button needs a connection: only show it when there is one
    document.getElementById('alt').style.display = online ? '' : 'none';
    document.getElementById('offmsg').textContent = online ? 'PFBeacon is slow to open.' : 'Connect to the internet, then tap Try again.';
  }
  function start() {
    off.style.display = 'none'; wait.style.display = 'flex'; loaded = false;
    if (navigator.onLine === false) { showOffline(); return; }
    app.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = APP_URL; f.title = 'PFBeacon';
    f.setAttribute('allow', 'clipboard-write');
    f.addEventListener('load', function () { loaded = true; showApp(); });
    app.appendChild(f);
    timer = setTimeout(function () { if (!loaded) showOffline(); }, 15000);
  }
  off.addEventListener('click', function (e) { if (e.target.id === 'alt') return; start(); });
  window.addEventListener('offline', function () { if (!loaded) showOffline(); });
  if (EXEC && EXEC.indexOf('PASTE-YOUR') < 0) start();
  else { wait.querySelector('.big').textContent = 'Not set up yet: put the ledger link in config.js'; }
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (x) {} }
})();
</script>
</body>
</html>
